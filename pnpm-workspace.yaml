packages:
  - apps/*
  - packages/*

# Versions every package shares. One place to bump the toolchain, and no way
# for two packages to type-check against two different compilers.
catalog:
  '@types/node': ^26.4.0
  typescript: ^7.0.2
  vitest: ^5.0.0
  zod: ^4.6.2

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - zod@4.6.2
