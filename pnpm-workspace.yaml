packages:
  - apps/*
  - packages/*

# Versions every package shares. One place to bump the toolchain, and no way
# for two packages to type-check against two different compilers.
catalog:
  '@types/node': ^26.4.0
  typescript: ^7.0.2
  vitest: ^5.0.0
  zod: ^4.6.2

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - zod@4.6.2

# Security patches for transitive dependencies of the Prisma CLI, which still
# pins the vulnerable ranges. Drop each entry once Prisma ships the bump.
overrides:
  deepmerge-ts@<8.0.0: ^8.0.2   # GHSA-ggr8-5vv4-36mx stack exhaustion
  mysql2@<3.23.1: ^3.24.4       # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3
