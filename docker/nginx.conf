# Serves the SPA and puts the API behind the same origin, so the browser sees
# one host: the session cookie stays same-origin and the API needs no CORS.
# The `/api` prefix and its stripping mirror the dev proxy in
# apps/web/vite.config.ts, so the API sees identical URLs in both.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Everything here is text; the posters come straight from TMDB.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Paths nginx must be able to write to as a non-root user.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API answers its own CSP, so this covers only what nginx serves
    # itself — the production half of the policy apps/web/vite.config.ts
    # applies to the dev server.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Fly's health check, answered without waking the API.
    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location /api/ {
      # The trailing slash on both sides is what strips the prefix, so the API
      # stays mounted at the root exactly as it is in development.
      proxy_pass http://127.0.0.1:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # The API's own policy must reach the browser unaltered.
      proxy_hide_header Content-Security-Policy;
      proxy_read_timeout 60s;
    }

    # Hashed filenames, so these can be cached indefinitely.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Any other path is a client route the SPA reads from the URL bar. The
    # index must never be cached, or a deploy's new asset hashes are missed.
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
  }
}
