name: movie-curator

services:
  db:
    image: postgres:18.6
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: curator
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d curator']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
