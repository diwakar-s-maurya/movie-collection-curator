name: movie-curator

services:
  db:
    image: postgres:18.6
    # Pinned rather than inherited: the image's zone is UTC only because its
    # base image is, and a server flag beats postgresql.conf, so this holds on
    # a volume initdb has already run against.
    command: postgres -c timezone=UTC -c log_timezone=UTC
    ports:
      - '5432:5432'
    environment:
      # For the container itself — psql, log file names, `date`.
      TZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: curator
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d curator']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
